name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    name: CodeQL ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [python, javascript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: github/codeql-action/init@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126  # v3
        with:
          languages: ${{ matrix.lang }}
          queries: security-extended
      - uses: github/codeql-action/analyze@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126  # v3
