name: Pruebas y seguridad

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # los lunes: vuelve a revisar dependencias aunque no haya cambios

permissions:
  contents: read

jobs:
  pytest:
    name: Pruebas (Home Assistant de prueba)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -q -p no:cacheprovider

  dependencias:
    name: Dependencias con fallas conocidas (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.7.3
      # lo que instala la integración en cada casa (manifest.json → requirements)
      - run: python -c "import json;print(chr(10).join(json.load(open('custom_components/matterai/manifest.json'))['requirements']))" > req-casa.txt
      - run: pip-audit -r req-casa.txt --strict

  semgrep:
    name: Análisis del código (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "setuptools<75" semgrep==1.97.0
      # reglas públicas de seguridad (sin cuenta): un hallazgo grave pone el CI en rojo
      - run: semgrep scan --config p/security-audit --config p/secrets --config p/python --config p/javascript --metrics=off --error --severity ERROR
